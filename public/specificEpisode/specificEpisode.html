<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Simpsons API</title>
    <link rel="stylesheet" href="specificEpisode.css" />
    <link rel="stylesheet" href="../background.css" />
    <link rel="stylesheet" href="../fonts/fonts.css" />
    <link rel="stylesheet" href="../components/starRating.css">
    <link rel="stylesheet" href="../components/likeButton.css">
    <link rel="stylesheet" href="../header.css">
  <link rel="stylesheet" href="../popup.css">
  </head>
  <body>
    <div class="sky">
      <div class="moon"></div>
      <div class="sun"></div>
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
      <div class="cloud cloud3"></div>
      <div class="cloud cloud4"></div>
    </div>

    <div id="site-header"></div>

    <button
      id="previouspage"
      onclick="location.href='../episodes/episodes.html'"
    >
      Go Back
    </button>

    <div id="episode-search-wrapper" class="search-wrapper">
      <input 
        type="text" 
        id="episode-search-input" 
        placeholder="Search for an episode..." 
        autocomplete="off"
      />
      <ul id="episode-search-results" hidden></ul>
    </div>

    <!-- Spinner -->
    <div id="episode-spinner" hidden>
      <div class="spinner"></div>
    </div>

    <div id="episodecontainer"></div>

    <div id="pagination">
      <button id="prev-btn">← Previous Episode</button>

      <button id="next-btn">Next Episode →</button>
    </div>

    <script type="module" src="specificEpisode.js"></script>
  </body>
</html>
