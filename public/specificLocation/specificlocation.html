<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Simpsons API</title>
    <link rel="stylesheet" href="specificLocation.css">
    <link rel="stylesheet" href="../background.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="../components/starRating.css">
    <link rel="stylesheet" href="../components/likeButton.css">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../popup.css">
    <link rel="stylesheet" href="../searchBar.css">
</head>
<body>

    <div class="sky">
       <div class="moon"></div>
       <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
    </div>

    <div id="site-header"></div>

    <button id="previouspage" onclick="location.href='../locations/locations.html'">Previous Page</button>

    <div id="location-search-wrapper" class="search-wrapper">
      <input 
        type="text" 
        id="location-search-input" 
        placeholder="Search for an location..." 
        autocomplete="off"
      />
      <ul id="location-search-results" hidden></ul>
    </div>

    <!-- Spinner -->
    <div id="location-spinner" hidden>
      <div class="spinner"></div>
    </div>  

    <div id="locationcontainer"></div>

    <div id="pagination">
        <button id="prev-btn">Previous Location</button>

        <button id="next-btn">Next Location</button>
    </div>
    
    <script type="module"
        src="specificLocation.js">
    </script>
</body>
</html>
